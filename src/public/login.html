<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WhatsApp Personal Scheduler</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
      </div>
      <h2>WhatsApp Scheduler</h2>
      <p class="subtitle">Personal Server Instance</p>
    </div>

    <form id="loginForm" class="login-form">
      <div id="errorBanner" class="alert alert-error" style="display: none;"></div>

      <div class="form-group">
        <label for="password">Dashboard Password</label>
        <div class="password-input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter server password"
            required
            autocomplete="current-password"
            autofocus
          >
          <button type="button" id="togglePasswordBtn" class="btn-toggle-eye" title="Toggle visibility">👁️</button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-block">
        Unlock Dashboard
      </button>

      <div class="login-footer">
        <span class="security-badge">🔒 End-to-End Session Protected</span>
        <p class="small-text">Asia/Karachi (PKT UTC+5) Operational Zone</p>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const errorBanner = document.getElementById('errorBanner');
    const submitBtn = document.getElementById('submitBtn');
    const toggleBtn = document.getElementById('togglePasswordBtn');

    toggleBtn.addEventListener('click', () => {
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Verifying...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value })
        });
        const data = await res.json();

        if (data.success) {
          window.location.href = '/';
        } else {
          errorBanner.innerText = data.error || 'Authentication failed.';
          errorBanner.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerText = 'Unlock Dashboard';
        }
      } catch (err) {
        errorBanner.innerText = 'Network error contacting server.';
        errorBanner.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Unlock Dashboard';
      }
    });
  </script>
</body>
</html>
